[project]
name = "voice-tts"
version = "0.1.0"
description = "From-scratch trainable text-to-speech model (acoustic model + Griffin-Lim vocoder)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "torchaudio>=2.1",
]

[project.optional-dependencies]
train = [
    "tensorboard>=2.13",
]

[project.scripts]
voice-tts = "voice_tts.synthesize:main"
voice-tts-train = "training.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["voice_tts*", "training*"]
