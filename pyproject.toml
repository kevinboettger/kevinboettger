[project]
name = "game-stems"
version = "0.1.0"
description = "Real-time stem separation for game audio on Windows (Demucs-based)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
    "soundfile>=0.12",
    "PyAudioWPatch>=0.2.12.7",
    "torch>=2.1",
    "torchaudio>=2.1",
    "demucs>=4.0.1",
]

[project.optional-dependencies]
train = [
    "tensorboard>=2.13",
]
analyze = [
    "scikit-learn>=1.3",
]

[project.scripts]
game-stems = "game_stems.main:main"
game-stems-train = "training.train:main"
game-stems-analyze = "analyzer.pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["game_stems*", "training*", "analyzer*"]
